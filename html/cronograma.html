<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma</title>
    <link rel="stylesheet" href="../css/cronograma.css">
</head>
<body>
    <div id="header">
            <h1>Safra Viva</h1>
            <img src="../img/campo.svg" alt="Lavoura ao amanhecer">
            <div id="nav">
                <a href="home.html">Home</a>
                <a href="cadastro.html">Cadastro</a>
                <a href="producao.html">Produção</a>
                <a href="cronograma.html" class="ativo">Cronograma</a>
                <a href="pragas.html">Pragas</a>
                <a href="fertilizantes.html">Fertilizantes</a>
                <a href="custos.html">Custos</a>
                <a href="ganho.html">Ganho futuro</a>
                <a href="maquinario.html">Maquinário</a>
                <a href="fornecedores.html">Fornecedores</a>
            </div>
        </div>
 
        <div id="main">
 
            <section>
                <h2>Cronograma de produção</h2>
                <div id="cron-aviso"></div>
                <div id="cron-conteudo">
                    <label for="sel-safra">Safra</label>
                    <select id="sel-safra" class="campo"></select>
 
                    <div class="tabela">
                        <table>
                            <caption id="cron-caption">Etapas</caption>
                            <thead><tr><th>Etapa</th><th>Início</th><th>Fim</th><th>Situação</th><th>Ação</th></tr></thead>
                            <tbody id="lista-etapas"></tbody>
                        </table>
                    </div>
 
                    <h3>Andamento do ciclo</h3>
                    <p><progress id="cron-progresso" max="100" value="0"></progress> <span id="cron-pct"></span></p>
                    <p id="cron-atual"></p>
 
                    <form id="form-etapa">
                        <fieldset>
                            <legend>Nova etapa</legend>
                            <label for="etapa-nome">Nome da etapa *</label>
                            <input type="text" id="etapa-nome" class="campo" placeholder="Ex.: Adubação de cobertura" required>
                            <label for="etapa-inicio">Início *</label>
                            <input type="date" id="etapa-inicio" class="campo" required>
                            <label for="etapa-fim">Fim *</label>
                            <input type="date" id="etapa-fim" class="campo" required>
                            <input type="submit" value="Adicionar etapa" class="botao">
                        </fieldset>
                    </form>
                    <div id="etapa-msg"></div>
                </div>
            </section>
        </div>
 
        <div id="footer">
            <p>&copy; 2026 Safra Viva.</p>
        </div>
        <script src="../java/dados.js"></script>
</body>
</html>
